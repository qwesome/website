<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CClock</title>

<!-- Favicon placeholder -->
<link id="favicon" rel="icon" href="">

<style>
:root {
  --bg: #0f172a;
  --tile: #020617;
  --border: #1e293b;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

body {
  margin: 0;
  padding: 1.5rem;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-y: auto;
}

h1 {
  text-align: center;
  font-size: 3rem;
  margin-bottom: 1rem;
  color: var(--text);
}

.header {
  display: flex;
  justify-content: flex-end;
  gap: 1rem;
  margin-bottom: 1rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
}

.zone {
  position: relative;
  background: var(--tile);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  display: flex;
  flex-direction: column;
}

.zone-label {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.time-container {
  height: 130px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.time-main {
  font-family: monospace;
  font-size: clamp(2rem, 6vw, 3.5rem);
  white-space: nowrap;
}

.date {
  margin-top: 0.35rem;
  font-size: 0.8rem;
  color: var(--muted);
}

.players {
  margin-top: 0.5rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
}

.player {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.1rem 0.3rem;
  flex-shrink: 0; 
}

img {
  width: 28px;
  height: 28px;
  image-rendering: pixelated;
  border-radius: 4px;
  border: 2px solid rgba(255,255,255,1);
}

label {
  font-size: 0.9rem;
  user-select: none;
}
</style>
</head>
<body>

<h1>CClock</h1>

<div class="header">
  <label>
    <input type="checkbox" id="formatToggle" checked />
    24h
  </label>
  <label>
    <input type="checkbox" id="secondsToggle" />
    Show Seconds
  </label>
</div>

<div class="grid" id="grid"></div>

<script>
const ZONES = [
  {
    timeZone: "America/Phoenix",
    players: [
      { username: "Beara3333", nickname: "Beara" },
      { username: "pixel8nightmare", nickname: "Joya" },
      { username: "Piginblack5207", nickname: "Buttons" },
      { username: "PalagiusIII", nickname: "Palagius" },
      { username: "Corner_Twist", nickname: "Corner" },
      { username: "Bluetifulmoon", nickname: "Blue" },
      { username: "Danthouman9", nickname: "Ender" }
    ]
  },
  {
    timeZone: "America/Chicago",
    players: [
      { username: "DS_Doomsyy", nickname: "Doom" },
      { username: "P3KK4", nickname: "Pekka" },  
      { username: "JKrocky5555", nickname: "Rocky" },
      { username: "RespawnZx", nickname: "Z" }
    ]
  },
  {
    timeZone: "America/New_York",
    players: [
      { username: "xAquaMuffin", nickname: "Aqua" },
      { username: "DTblossom", nickname: "DT" },
      { username: "Sunday_Coffee", nickname: "Sundaey" },
      { username: "EORI0128", nickname: "Misty" },
      { username: "Rocksoxx", nickname: "Rox" },
      { username: "Littlebutter_", nickname: "Butter" }
    ]
  },
  {
    timeZone: "Europe/London",
    players: [
      { username: "Babgabriel", nickname: "Gab" },
      { username: "MusicGeek_X", nickname: "Music" }
    ]
  },
  {
    timeZone: "Europe/Stockholm",
    players: [
      { username: "FantasticFella", nickname: "Deep" }
    ]
  },
  {
    timeZone: "Australia/Adelaide",
    players: [
      { username: "wickedsummerr", nickname: "Summer" }
    ]
  },
  {
    timeZone: "Pacific/Auckland",
    players: [
      { username: "qwesome", nickname: "Q" }
    ]
  }
];

const grid = document.getElementById("grid");
const formatToggle = document.getElementById("formatToggle");
const secondsToggle = document.getElementById("secondsToggle");
const favicon = document.getElementById("favicon");

// Flatten all usernames for favicon rotation
const allPlayers = ZONES.flatMap(zone => zone.players.map(p => p.username));

// Helper functions
function getZoneLabel(date, timeZone) {
  return new Intl.DateTimeFormat(undefined, {
    timeZone,
    timeZoneName: "short"
  }).formatToParts(date).find(p => p.type === "timeZoneName").value;
}

function getTimeParts(date, timeZone, use24Hour) {
  const options = {
    timeZone,
    hour: "2-digit",
    minute: "2-digit",
    hour12: !use24Hour
  };
  if (secondsToggle.checked) options.second = "2-digit";

  const parts = new Intl.DateTimeFormat(undefined, options).formatToParts(date);
  const get = t => parts.find(p => p.type === t)?.value;

  let hour = get("hour");
  if (!use24Hour && hour.startsWith("0")) hour = hour.slice(1);

  return {
    hour,
    minute: get("minute"),
    second: get("second"),
    ampm: get("dayPeriod")
  };
}

function formatDate(date, timeZone) {
  return new Intl.DateTimeFormat(undefined, {
    timeZone,
    weekday: "short",
    day: "2-digit",
    month: "short"
  }).format(date);
}

ZONES.forEach(zone => {
  const zoneDiv = document.createElement("div");
  zoneDiv.className = "zone";

  const labelDiv = document.createElement("div");
  labelDiv.className = "zone-label";
  zoneDiv.appendChild(labelDiv);

  const timeContainer = document.createElement("div");
  timeContainer.className = "time-container";

  const timeMain = document.createElement("div");
  timeMain.className = "time-main";

  const dateDiv = document.createElement("div");
  dateDiv.className = "date";

  timeContainer.appendChild(timeMain);
  timeContainer.appendChild(dateDiv);
  zoneDiv.appendChild(timeContainer);

  const playersDiv = document.createElement("div");
  playersDiv.className = "players";
  zone.players.forEach(p => {
    const playerDiv = document.createElement("div");
    playerDiv.className = "player";
    playerDiv.title = p.username;

    const img = document.createElement("img");
    img.src = `https://minotar.net/helm/${p.username}/28.png`;
    img.alt = p.username;
    img.onerror = () => { img.alt = ""; };

    const nameDiv = document.createElement("div");
    nameDiv.textContent = p.nickname;

    playerDiv.appendChild(img);
    playerDiv.appendChild(nameDiv);
    playersDiv.appendChild(playerDiv);
  });
  zoneDiv.appendChild(playersDiv);

  grid.appendChild(zoneDiv);

  zone._elements = { label: labelDiv, timeMain, date: dateDiv };
});

// --- Update time/date ---
function updateTime() {
  const now = new Date();
  const use24Hour = formatToggle.checked;

  ZONES.forEach(zone => {
    const t = getTimeParts(now, zone.timeZone, use24Hour);

    let timeString = `${t.hour}:${t.minute}`;
    if (secondsToggle.checked && t.second) timeString += `:${t.second}`;
    if (!use24Hour && t.ampm) timeString += t.ampm.toUpperCase();

    zone._elements.timeMain.textContent = timeString;
    zone._elements.date.textContent = formatDate(now, zone.timeZone);
    zone._elements.label.textContent = getZoneLabel(now, zone.timeZone);
  });
}

function updateFavicon() {
  const randomUsername = allPlayers[Math.floor(Math.random() * allPlayers.length)];
  favicon.href = `https://minotar.net/helm/${randomUsername}/32.png`;
}

updateTime();
updateFavicon();

setInterval(updateTime, 1000);
setInterval(updateFavicon, 60000);

// Event listeners
formatToggle.addEventListener("change", updateTime);
secondsToggle.addEventListener("change", updateTime);
</script>

</body>
</html>
